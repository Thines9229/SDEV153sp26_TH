<script>
function validateForm() {
    const phonenumber = document.forms[0].myPhone.value
     const regex = /^\d{3}-\d{3}-\d{4}$/;
        if (regex.test(phonenumber)) {
          return true;
        } else {
          alert(
            "invalid phone number: This must be a 10 digit phine number with a 3 digit area code, "+
            " a dash, 3 digits for the first part of the phone number, a dash, "+
            "and 4 more digitd for the remainder of the phone number."
          );
          return false;
        }
      }
</script>

<main>
 <h2>Contact Us</h2>
 <p>Required fields are marked with an asterisk*</p>
 <form method="post" action="https://webdevbasics.net/scripts/demo.php"
    onsubmit="return validateForm();">
  <label for="myFName">*First Name:</label>
  <input type="text" name="myFName" id="myFName" required>
  <label for="myLName">*Last Name:</label>
  <input type="text" name="myLName" id="myLName" required>
  <label for="myEmail">*E-mail:</label>
  <input type="text" name="myEmail" id="myEmail" required>
  <label for="myPhone">*Phone:</label>
  <input type="text" name="myPhone" id="myPhone" minlength="12" maxlength="12">
  <label for="myComments">Comments:</label>
  <textarea name="myComments" id="myComments" rows="2" cols="20"></textarea>
  <input type="submit" id="mySubmit" value="Submit">
</form>
